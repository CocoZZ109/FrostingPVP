
name: Build FrostingPVP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
          cache-disabled: true

      - name: Show project files
        run: |
          pwd
          ls -la
          find . -maxdepth 5 -type f

      - name: Compile plugin
        id: compile
        continue-on-error: true
        run: |
          gradle clean build --no-daemon --stacktrace > build-log.txt 2>&1
          cat build-log.txt
          test ${PIPESTATUS[0]} -eq 0

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FrostingPVP-Build-Log
          path: build-log.txt

      - name: Upload JAR
        if: steps.compile.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: FrostingPVP-JAR
          path: build/libs/*.jar

      - name: Report build failure
        if: steps.compile.outcome == 'failure'
        run: exit 1
