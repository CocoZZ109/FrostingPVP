
name: FrostingPVP Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Compile FrostingPVP
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
          cache-disabled: true

      - name: Check project files
        run: |
          echo "Checking FrostingPVP files..."
          ls -la
          find src -type f

      - name: Compile plugin
        run: gradle clean build --no-daemon --stacktrace

      - name: Find compiled JAR
        run: |
          echo "Looking for compiled plugins..."
          find build/libs -type f -name "*.jar"

      - name: Upload FrostingPVP JAR
        uses: actions/upload-artifact@v4
        with:
          name: FrostingPVP-JAR
          path: build/libs/*.jar
          if-no-files-found: error
