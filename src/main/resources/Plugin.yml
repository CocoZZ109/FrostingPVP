name: FrostingPVP
version: '${version}'
main: com.frostingpvp.FrostingPVP
api-version: '26.2'
author: FrostingPVP
description: Christmas-themed PvP network with chest GUI menus.
commands:
  pvp:
    description: Open the FrostingPVP game selector.
    usage: /pvp
    aliases: [games, play]
  duel:
    description: Challenge another player.
    usage: /duel <player>
  accept:
    description: Accept an incoming duel request.
    usage: /accept <player>
  admin:
    description: FrostingPVP operator administration.
    usage: /admin
    permission: frostingpvp.admin
permissions:
  frostingpvp.admin:
    description: Access FrostingPVP administration.
    default: op
